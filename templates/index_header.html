<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="{{WEBNAME}} — {{WEBDESC}}">

  <title>{{WEBNAME}}</title>

  <style>
    :root {
      --paper: #fdfdfb;
      --ink: #202020;
      --muted: #777;
      --rule: #d9d9d5;
      --accent: #254d68;
      --max-width: 760px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-thickness: 2px;
    }

    .page {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
      padding: 72px 0 100px;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--rule);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: normal;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .about {
      margin-top: 14px;
      font-size: 0.95rem;
    }

    .about a {
      color: var(--muted);
      text-decoration: none;
    }

    .about a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    main {
      padding-top: 42px;
    }

    .category {
      margin-bottom: 42px;
    }

    .category:last-child {
      margin-bottom: 0;
    }

    .category-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .links {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .links li {
      border-bottom: 1px solid var(--rule);
    }

    .links li:first-child {
      border-top: 1px solid var(--rule);
    }

    .links a {
      display: block;
      padding: 11px 4px;
      color: var(--ink);
      text-decoration: none;
    }

    .links a:hover {
      padding-left: 8px;
      color: var(--accent);
    }

    .name {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .name li {
      border-bottom: 1px solid var(--rule);
      display: block;
      padding: 11px 4px;
      color: var(--ink);
      text-decoration: none;
    }

    .name li:first-child {
      border-top: 1px solid var(--rule);
    }

    footer {
      margin-top: 70px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .page {
        width: min(calc(100% - 30px), var(--max-width));
        padding-top: 45px;
      }

      main {
        padding-top: 32px;
      }

      .category {
        margin-bottom: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <h1>{{WEBNAME}}</h1>

      <div class="about">
         Book reivews for self-study students and independent scholars.
      </div>
      <div class="about">
         <i><a href="#name">Why {{WEBNAME}}?</a></i>
      </div>
    </header>

    <main>
